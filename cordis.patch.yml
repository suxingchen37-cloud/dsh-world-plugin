# dsh-local-computer bundle patch
#
# 只有一行：服务端插件。它同时注册两套工具并提供一个本机回环端点：
#   1) 团队/笔记本工具（apply_new_bot、org_*、brain_*）
#   2) 本机执行的九个 computer_* 工具
# 说明：
# - **不再有 MCP 子进程那一行**。以前那行要写死 node 解释器和 server.mjs 的绝对路径，
#   换台机器就起不来；现在同一份代码在宿主进程里用 ctx.tools 注册，补丁里没有任何本机路径。
# - 不写任何模型配置 —— provider/model 一律跟随 profile 里的 agent-default-model
#   （实测为 deepseek-account / deepseek-flash），所以这个插件天生全用 DeepSeek。
- insert:
    - id: local-computer
      name: dsh-local-computer
