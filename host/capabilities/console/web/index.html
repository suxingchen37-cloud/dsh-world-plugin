<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共振</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mark">共</span><div><h1>共振</h1><small>AI TEAM CONSOLE</small></div></div>
    <div class="needbox" id="needbox" hidden></div>
    <div class="rooms" id="roomList"></div>
    <div class="foot">
      <button class="k" id="autonomyBtn" title="关闭后本机执行整体冻结，agent 不得自答审批"><span class="led" id="autonomyLed"></span><span id="autonomyText">全自动</span></button>
      <button id="notebookBtn">本子</button>
    </div>
  </aside>

  <main class="main">
    <header class="hd">
      <div class="t">
        <h2 id="roomName">… <span class="kind mono" id="roomKind"></span></h2>
        <p id="roomSub"></p>
      </div>
      <div class="cast" id="cast"></div>
    </header>

    <div id="offlineBanner"></div>
    <div class="pending-zone" id="bannerZone"></div>

    <div class="stream" id="stream"><div class="empty">连接中…</div></div>

    <div class="run" id="typing" hidden></div>

    <div class="quoteline" id="quoteline" hidden>
      <span class="q-tag mono">追问</span><span class="q-text" id="quoteText"></span>
      <button class="q-x" id="quoteX">✕</button>
    </div>

    <div class="input-zone">
      <div class="mention-pop" id="mentionPop" hidden></div>
      <div class="box">
        <button class="chip" id="rememberBtn" title="记住模式：发送的内容直接入本子，不进聊天">记</button>
        <textarea id="input" rows="1" placeholder="发消息，@ 点名谁回……" autocomplete="off"></textarea>
        <button class="go" id="sendBtn">发送</button>
      </div>
      <div class="hint mono"><span>ENTER 发送</span><span>CTRL+K 指令</span><span>「记住：」= 直接入本子</span></div>
    </div>
    <div class="toasts" id="toasts"></div>
  </main>

  <div class="monitor" id="monitor" hidden>
    <div class="monitor-drag" id="monitorDrag" title="拖动调宽"></div>
    <div class="monitor-head"><span class="mono">现 场</span><button class="m-x" id="monitorX">›</button></div>
    <div class="monitor-body" id="monitorBody"></div>
  </div>
  <button class="monitor-show" id="monitorShow">现 场</button>
</div>

<div class="sheetwrap" id="sheet" hidden>
  <div class="scrim" id="sheetScrim"></div>
  <div class="sheet" id="sheetBody"></div>
</div>

<div class="palette-wrap" id="palette" hidden>
  <div class="scrim" id="paletteScrim"></div>
  <div class="palette">
    <div class="palette-in"><span class="p mono">›</span><input id="paletteInput" placeholder="输入指令或搜索房间…"></div>
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-ft mono">↑↓ 选择 · ENTER 执行 · ESC 关闭</div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
