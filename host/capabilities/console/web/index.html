<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共振</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><h1>共振</h1><p class="sub mono" id="modeBadge"></p></div>
    <div class="rail-scroll">
      <div class="rail-title mono">房间</div>
      <div id="roomList"></div>
      <div class="rail-title mono">名册</div>
      <div id="roster"></div>
    </div>
    <div class="rail-foot">
      <label class="switch-wrap" title="关闭后本机执行整体冻结，agent 不得自答审批">
        <span>自主执行</span><span class="d-sw" id="autonomySwitch" role="switch" aria-checked="true" tabindex="0"><i></i></span>
      </label>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <div class="chat-head-main">
        <h2 id="roomName">…</h2>
        <p class="sub" id="roomSub"></p>
      </div>
      <div class="chat-head-side">
        <button class="btn" id="notebookBtn">本子</button>
        <div class="members mono" id="roomMembers"></div>
      </div>
    </header>

    <div class="banner-zone" id="offlineBanner"></div>
    <div class="banner-zone" id="bannerZone"></div>

    <div class="stream" id="stream"><div class="empty">连接中…</div></div>

    <div class="typing-row" id="typing" hidden>
      <span class="d-typing"><i></i><i></i><i></i></span>
      <span class="mono muted" id="typingNames"></span>
    </div>

    <footer class="composer">
      <button class="pin-btn" id="rememberBtn" title="记住：这条不进聊天，直接进当前 Bot 的本子（群聊进团队本子）">记</button>
      <textarea id="input" rows="1" placeholder="发消息，@名字 点名谁回；Enter 发送"></textarea>
      <button class="send-btn press-depth" id="sendBtn" title="发送">➤</button>
    </footer>
    <div class="toasts" id="toasts"></div>
  </main>

  <div class="sheetwrap" id="sheet" hidden>
    <div class="scrim" id="sheetScrim"></div>
    <div class="sheet" id="sheetBody"></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
