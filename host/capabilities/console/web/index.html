<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共振</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">共振<span class="ver">RESONANCE</span></div>
    <div class="rooms" id="roomList"></div>
    <div class="rail-foot">
      <button class="tool" id="notebookBtn"><span class="ico">▤</span> 本子</button>
      <label class="sw-wrap" title="关闭后本机执行整体冻结，agent 不得自答审批">
        <span>自主执行</span><span class="d-sw" id="autonomySwitch" role="switch" aria-checked="true" tabindex="0"><i></i></span>
      </label>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <div class="title"><h2 id="roomName">…</h2><p id="roomSub"></p></div>
      <div class="head-right">
        <span class="members mono" id="roomMembers"></span>
        <span class="mode-badge" id="modeBadge"></span>
      </div>
    </header>

    <div id="offlineBanner"></div>
    <div class="pending-zone" id="bannerZone"></div>

    <div class="stream" id="stream"><div class="empty">连接中…</div></div>

    <div class="runline" id="typing" hidden></div>

    <div class="quoteline" id="quoteline" hidden>
      <span class="q-tag mono">追问</span><span class="q-text" id="quoteText"></span>
      <button class="q-x" id="quoteX">✕</button>
    </div>

    <div class="composer-zone">
      <div class="mention-pop" id="mentionPop" hidden></div>
      <div class="composer" id="composer">
        <button class="chip" id="rememberBtn" title="记住模式：发送的内容直接入本子，不进聊天">记</button>
        <textarea id="input" rows="1" placeholder="发消息，@ 点名谁回 · Ctrl+K 万能指令" autocomplete="off"></textarea>
        <button class="send" id="sendBtn" title="发送">↑</button>
      </div>
      <div class="composer-hint mono">Enter 发送 · Shift+Enter 换行 · Ctrl+K 指令面板</div>
    </div>
    <div class="toasts" id="toasts"></div>
  </main>

  <div class="monitor" id="monitor" hidden>
    <div class="monitor-drag" id="monitorDrag" title="拖动调宽"></div>
    <div class="monitor-head">
      <span class="mono">现 场</span>
      <button class="m-x" id="monitorX" title="收起">›</button>
    </div>
    <div class="monitor-body" id="monitorBody"></div>
  </div>
  <button class="monitor-show" id="monitorShow" title="展开现场">‹ 现 场</button>

  <div class="sheetwrap" id="sheet" hidden>
    <div class="scrim" id="sheetScrim"></div>
    <div class="sheet" id="sheetBody"></div>
  </div>

  <div class="palette-wrap" id="palette" hidden>
    <div class="scrim" id="paletteScrim"></div>
    <div class="palette">
      <div class="palette-in"><span class="p">›</span><input id="paletteInput" placeholder="输入指令或搜索房间…（@切换 · 记 入本子 · 批 审批）"></div>
      <div class="palette-list" id="paletteList"></div>
      <div class="palette-ft mono">↑↓ 选择 · Enter 执行 · Esc 关闭</div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
